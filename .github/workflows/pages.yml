name: deploy-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage project site
        run: |
          mkdir -p _site/assets
          cp index.html .nojekyll _site/
          cp assets/style.css assets/app.js _site/assets/
          cp assets/{motivation,architecture,qualitative,module-necessity-mae,module-necessity-corr,query-resampler-reliability,query-resampler-rank,query-resampler-similarity}.png _site/assets/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
